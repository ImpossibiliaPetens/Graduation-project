t-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif">四个按键 SW2 到 SW5</text><text x="346" y="258" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#0F6E56" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif">PB12 菜单，PB13 加，PB14 减，PB15 确认</text><text x="346" y="278" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#0F6E56" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif">每个开关的另一脚接 GND</text><text x="346" y="298" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#0F6E56" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif">软件使用内部上拉</text><rect x="330" y="330" width="310" height="44" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="346" y="345" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif">水泵 LED（U5）</text><text x="346" y="363" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#993C1D" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif">PA4 经 330Ω（R1），LED 另一端接 GND</text><rect x="330" y="386" width="310" height="44" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="346" y="401" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif">电磁阀 LED（U6）</text><text x="346" y="419" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#993C1D" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif">PA5 经 330Ω（R4），LED 另一端接 GND</text><rect x="330" y="442" width="310" height="44" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="346" y="457" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif">蜂鸣器（U7）</text><text x="346" y="475" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#993C1D" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif">PA6 经 1k（R3）到 S8050 基极；蜂鸣器接 5V</text><rect x="330" y="498" width="310" height="92" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="346" y="516" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#854F0B" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif">3V3：传感器、土壤模块、上拉电阻、100nF</text><text x="346" y="544" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#854F0B" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif">5V：OLED 模块、蜂鸣器</text><text x="346" y="572" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#854F0B" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif">GND：所有地线、S8050 发射极</text></svg>
