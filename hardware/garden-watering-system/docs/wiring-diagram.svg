="256" text-anchor="end" dominant-baseline="central" font-size="14" fill="#3C3489" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif">PB13</text><line x1="170" y1="256" x2="330" y2="256" stroke="#444" stroke-width="1.2"/><text x="160" y="280" text-anchor="end" dominant-baseline="central" font-size="14" fill="#3C3489" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif">PB14</text><line x1="170" y1="280" x2="330" y2="280" stroke="#444" stroke-width="1.2"/><text x="160" y="304" text-anchor="end" dominant-baseline="central" font-size="14" fill="#3C3489" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif">PB15</text><line x1="170" y1="304" x2="330" y2="304" stroke="#444" stroke-width="1.2"/><text x="160" y="362" text-anchor="end" dominant-baseline="central" font-size="14" fill="#3C3489" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif">PA4</text><line x1="170" y1="362" x2="330" y2="362" stroke="#444" stroke-width="1.2"/><text x="160" y="446" text-anchor="end" dominant-baseline="central" font-size="14" fill="#3C3489" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif">PA5</text><line x1="170" y1="446" x2="330" y2="446" stroke="#444" stroke-width="1.2"/><text x="160" y="502" text-anchor="end" dominant-baseline="central" font-size="14" fill="#3C3489" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif">PA6</text><line x1="170" y1="502" x2="330" y2="502" stroke="#444" stroke-width="1.2"/><text x="160" y="554" text-anchor="end" dominant-baseline="central" font-size="14" fill="#3C3489" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif">+3V3</text><line x1="170" y1="554" x2="330" y2="554" stroke="#444" stroke-width="1.2"/><text x="160" y="582" text-anchor="end" dominant-baseline="central" font-size="14" fill="#3C3489" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif">+5V</text><line x1="170" y1="582" x2="330" y2="582" stroke="#444" stroke-width="1.2"/><text x="160" y="610" text-anchor="end" dominant-baseline="central" font-size="14" fill="#3C3489" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif">GND</text><line x1="170" y1="610" x2="330" y2="610" stroke="#444" stroke-width="1.2"/><rect x="330" y="36" width="310" height="60" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="346" y="55" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif">I2C 总线：PB6=SCL，PB7=SDA</text><text x="346" y="77" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#0F6E56" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif">OLED、BH1750、SHT30；4.7k 上拉到 3V3</text><rect x="330" y="108" width="310" height="44" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="346" y="123" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif">土壤传感器（H1 第 2 脚 AOUT）</text><text x="346" y="141" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#0F6E56" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif">第 1 脚接 3V3，第 3 脚接 GND</text><rect x="330" y="164" width="310" height="44" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="346" y="179" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif">水位开关（U4 第 1 脚）</text><text x="346" y="197" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#0F6E56" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif">U4 第 2 脚接 GND</text><rect x="330" y="218" width="310" height="100" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="346" y="236" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif">四个按键 SW2 到 SW5</text><text x="346" y="258" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#0F6E56" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif">PB12 菜单，PB13 加，PB14 减，PB15 确认</text><text x="346" y="278" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#0F6E56" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif">每个开关的另一脚接 GND</text><text x="346" y="298" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#0F6E56" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif">软件使用内部上拉</text><rect x="330" y="330" width="310" height="92" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="346" y="347" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif">水泵：LED 指示（U5）+ 驱动（Q1）</text><text x="346" y="368" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#993C1D" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif">PA4 经 330Ω（R1）点亮 LED U5 到 GND</text><text x="346" y="388" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#993C1D" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif">PA4 经 1k（R2）推 S8050（Q1）基极</text><text x="346" y="408" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#993C1D" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif">泵接 U2：脚1=5V 经 18Ω（R7），脚2=Q1 集；D1 续流</text><rect x="330" y="434" width="310" height="44" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="346" y="449" text-anchor="start" dominant-baseline="central" font-size="14" 